version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    restart: always
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_secure_password_2026
    ports:
      # Mapped to 5434 on host to avoid conflict with local host PostgreSQL services (5432/5433)
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://restaurant_user:restaurant_secure_password_2026@db:5432/restaurant_db
      - SECRET_KEY=restaurant_jwt_super_secret_production_key_987654321
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    ports:
      # Mapped to 8005 on host to avoid port 8000 collisions
      - "8005:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: always
    depends_on:
      - backend
    ports:
      # Accessible at http://localhost:3000 or http://localhost:80
      - "3000:80"
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
